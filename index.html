<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My CS2 Setup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{
  colors:{cream:'var(--cream)',sand:'var(--sand)',sage:'var(--sage)',terra:'var(--terra)',bark:'var(--bark)',mute:'var(--mute)'},
  fontFamily:{serif:['"Cormorant Garamond"','Georgia','serif'],sans:['Outfit','system-ui','sans-serif']}
}}}
</script>
<style>
:root{--cream:#FDFBF7;--sand:#EFE6D6;--sage:#8A9A86;--terra:#C47A5A;--bark:#2C2A29;--mute:#7a7268;--glass2:rgba(255,255,255,.6);--line:rgba(44,42,41,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#1d1c1a;--sand:#272522;--bark:#f1ebe0;--mute:#a79f93;--glass2:rgba(60,56,50,.55);--line:rgba(241,235,224,.14)}}
:root[data-theme="dark"]{--cream:#1d1c1a;--sand:#272522;--bark:#f1ebe0;--mute:#a79f93;--glass2:rgba(60,56,50,.55);--line:rgba(241,235,224,.14)}
html{scroll-padding-top:90px;scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--bark)}
.glass{background:rgba(253,251,247,.22);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.45);box-shadow:0 24px 60px rgba(20,38,26,.28)}
.glass2{background:var(--glass2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 18px 50px rgba(44,42,41,.08)}
.canopy{background:radial-gradient(ellipse 60% 55% at 78% -5%,rgba(255,246,208,.95),rgba(255,246,208,0) 60%),linear-gradient(165deg,#1b3426 0%,#355c3f 38%,#6f8c5d 72%,#b9c58f 100%)}
.ray{position:absolute;top:-12%;height:135%;transform-origin:top center;background:linear-gradient(180deg,rgba(255,238,176,.7),rgba(255,238,176,0) 85%);filter:blur(16px);mix-blend-mode:screen;animation:ray 11s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.35}to{opacity:.95}}
.dap{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,240,190,.55),rgba(255,240,190,0) 68%);filter:blur(6px);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,28px) scale(1.15)}}
#shade{position:fixed;inset:-6%;width:112%;height:112%;z-index:40;pointer-events:none;mix-blend-mode:multiply;filter:blur(7px);opacity:.55;animation:sway 26s ease-in-out infinite alternate}
@keyframes sway{from{transform:translate(0,0) rotate(0)}to{transform:translate(2.2%,1.4%) rotate(1.2deg)}}
.cta{background:linear-gradient(135deg,#d58f6c,#C47A5A 55%,#b8684a);color:#fff;border:0;border-radius:999px;padding:14px 30px;font:500 16px Outfit,sans-serif;cursor:pointer;box-shadow:0 0 0 0 rgba(196,122,90,.5),0 10px 30px rgba(196,122,90,.45);transition:transform .25s,box-shadow .25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 36px 6px rgba(232,170,130,.55),0 14px 34px rgba(196,122,90,.5)}
.pill{font:500 14px Outfit,sans-serif;border-radius:999px;padding:8px 18px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;transition:background .2s}
.pill:hover{background:rgba(255,255,255,.35)}
.inp{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--terra);font:inherit;color:inherit;padding:2px 0;border-radius:0}
.edonly{display:none!important}
.editing .edonly{display:block!important}
.editing .view{display:none!important}
.editing #edit{display:none}
.editing #handle{outline:2px dashed #fff;outline-offset:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body class="font-sans font-light">
<svg id="shade" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

<nav class="glass fixed z-50 top-4 left-1/2 -translate-x-1/2 w-[min(94vw,640px)] rounded-full px-5 py-2.5 flex items-center justify-between gap-3 text-[#FDFBF7]" id="app">
  <a href="#top" class="font-serif text-xl font-semibold" id="navname">ako</a>
  <div class="hidden sm:flex gap-5 text-sm"><a href="#crosshair">Crosshair</a><a href="#settings">Settings</a><a href="#gear">Gear</a></div>
  <div class="flex gap-1.5">
    
    
    
  </div>
</nav>

<header id="top" class="canopy relative overflow-hidden min-h-screen text-[#FDFBF7]">
  <div id="rays" class="absolute inset-0"></div>
  <div id="daps" class="absolute inset-0"></div>
  <svg id="leafFar" class="absolute inset-0 w-full h-full blur-[3px] opacity-80" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <svg id="leafNear" class="absolute inset-0 w-full h-full" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

  <div class="relative z-10 max-w-6xl mx-auto px-6 pt-36 pb-20 grid lg:grid-cols-[1.25fr_1fr] gap-12 items-center min-h-screen">
    <div>
      <h1 id="handle" data-k="handle" class="font-serif font-medium leading-[.9] text-[clamp(64px,13vw,168px)] break-words [text-shadow:0_6px_40px_rgba(10,30,18,.45)]"></h1>
      <p class="mt-6 max-w-md text-lg opacity-90 [text-shadow:0_2px_16px_rgba(0,0,0,.35)]">The settings, crosshair and gear behind my aim, kept in one quiet place.</p>
      <a href="#crosshair" class="cta inline-block mt-9 no-underline">See my setup</a>
    </div>
    <div class="relative lg:ml-auto w-full max-w-sm">
      <div class="glass rounded-[28px] px-6 py-5 flex gap-8" id="stats"></div>
    </div>
  </div>
</header>

<main class="relative max-w-6xl mx-auto px-6">
  <section id="crosshair" class="pt-28 grid lg:grid-cols-[1fr_1.2fr] gap-12 items-start">
    <div>
      <h2 class="font-serif text-6xl leading-none">Crosshair</h2>
      <p class="mt-5 text-mute max-w-sm text-lg">Paste this command into the console to load my crosshair.</p>
      <div class="hidden"><svg id="xh" viewBox="-60 -60 120 120"></svg></div><div id="cc" class="hidden"></div>
      <button id="copy" class="pill mt-8">Copy commands</button>
    </div>
    <div class="glass2 rounded-[32px] p-8">
      <div id="xspec" class="hidden"></div>
      <p class="text-sm text-mute mb-3">Console command</p>
      <p id="code" class="p-5 rounded-2xl bg-sand text-bark font-mono text-sm sm:text-base leading-relaxed break-all"></p>
      <div class="edonly mt-4"><input id="codein" class="inp" aria-label="Crosshair share code"></div>
    </div>
  </section>

  <section id="settings" class="pt-36">
    <h2 class="font-serif text-6xl leading-none mb-14">Settings</h2>
    <div id="sets" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 items-start"></div>
  </section>

  <section id="gear" class="pt-36 pb-28">
    <div class="rounded-[40px] bg-sand p-8 sm:p-14 grid lg:grid-cols-[.8fr_1.4fr] gap-10" id="gearbox"></div>
  </section>
</main>

<footer class="relative text-center text-mute text-sm pb-14 px-6">Last updated <span id="upd">today</span>. Settings can change after game updates, so check in-game.</footer>

<script>
const DEFAULT = {
  handle:"ako", code:"CSS2YDVd2nLCjns3PKOM6ubUzGVMo9dMfULKzhESkpATyF",
  xh:{size:2.5,thick:1,gap:-2,dot:0,outline:1,color:"#33ff66"},
  groups:[
    {title:"Mouse",rows:[["DPI","800"],["In-game sensitivity","1.17"],["Polling rate","1000 Hz"]]},
    {title:"Video",rows:[["Resolution","1280×960"],["Aspect ratio","4:3"],["Scaling","Stretched"],["Refresh rate","280 Hz"],["Boost player contrast","Enabled"]]},
    {title:"Viewmodel",rows:[["FOV","68"],["Offset X","2.5"],["Offset Y","0"],["Offset Z","-1.5"]]},
    {title:"Gear",gear:1,rows:[["Mouse","Lamzu Atlantis Mini"],["Mousepad","Artisan Type-99 Soft"],["Keyboard","Custom Zoom75"],["Monitor","Zowie XL2546X+"],["Earphones","Moondrop Lan"]]}
  ]
};
const XSPEC=[["size","Length"],["thick","Thickness"],["gap","Gap"],["dot","Center dot"],["outline","Outline"]];
const COLORS=["#33ff66","#ffee33","#33e0ff","#ff4d4d","#ffffff"];
const ICON={Mouse:'<rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 3v6"/>',Video:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',Viewmodel:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',Gear:'<path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',"Launch options":'<path d="M5 8l4 4-4 4M12 17h7"/>'};
let S;
S=null;
if(!S) S=JSON.parse(JSON.stringify(DEFAULT));
S.groups=S.groups.filter(g=>g.title!=="Launch options");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const val=(g,l)=>{ const grp=S.groups.find(x=>x.title===g); const r=grp&&grp.rows.find(x=>x[0]===l); return r?r[1]:"" };

/* light and leaves */
let seed=11; const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const leaf=(x,y,s,r,f,o)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})" fill="${f}" opacity="${o}"><path d="M0 0C20-34 62-34 86 0C62 34 20 34 0 0Z"/></g>`;
function scene(){
  const G=["#16301f","#1f3d2a","#2c5136","#3d6a45"];
  let far="",near="",sh="";
  for(let i=0;i<60;i++){ const edge=R()<.3; const x=edge?(R()<.5?R()*110:890+R()*110):R()*1000, y=edge?R()*620:(R()**2.2)*250-30;
    far+=leaf(x,y,.9+R()*1.4,R()*360,G[(R()*4)|0],.7+R()*.25); }
  for(let i=0;i<22;i++){ const x=R()<.5?R()*180-30:850+R()*180, y=(R()**1.6)*330-40;
    near+=leaf(x,y,1.8+R()*1.8,R()*360,G[(R()*2)|0],.95); }
  for(let i=0;i<26;i++) sh+=leaf(R()*1000,R()*1000,2+R()*3,R()*360,"#2C2A29",.08+R()*.09);
  $("leafFar").innerHTML=far; $("leafNear").innerHTML=near; $("shade").innerHTML=sh;
  let rays="",daps="";
  for(let i=0;i<7;i++) rays+=`<div class="ray" style="left:${8+i*13+R()*6}%;width:${6+R()*9}vw;transform:rotate(${-24+R()*8}deg);animation-delay:-${(R()*10).toFixed(1)}s;animation-duration:${8+R()*8}s"></div>`;
  for(let i=0;i<14;i++){ const s=70+R()*200; daps+=`<div class="dap" style="left:${R()*95}%;top:${20+R()*70}%;width:${s}px;height:${s}px;animation-delay:-${(R()*20).toFixed(1)}s"></div>`; }
  $("rays").innerHTML=rays; $("daps").innerHTML=daps;
}

function drawXhair(){
  const c=S.xh, u=5, g=(c.gap+5)*1.2, len=c.size*u, th=Math.max(c.thick*u*.4,1.2);
  const bar=(x,y,w,h)=>(c.outline?`<rect x="${x-1}" y="${y-1}" width="${w+2}" height="${h+2}" fill="#000"/>`:"")+`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c.color}"/>`;
  let svg=bar(-th/2,-g-len,th,len)+bar(-th/2,g,th,len)+bar(-g-len,-th/2,len,th)+bar(g,-th/2,len,th);
  if(c.dot) svg+=bar(-th/2,-th/2,th,th);
  $("xh").innerHTML=svg;
}
function cmd(){ return "apply_crosshair_code "+(S.code||"") }
function cmdOld(){
  const c=S.xh, rgb=[1,3,5].map(i=>parseInt(c.color.slice(i,i+2),16));
  return `cl_crosshairstyle 4; cl_crosshairsize ${c.size}; cl_crosshairthickness ${c.thick}; cl_crosshairgap ${c.gap}; cl_crosshairdot ${c.dot}; cl_crosshair_drawoutline ${c.outline}; cl_crosshaircolor 5; cl_crosshaircolor_r ${rgb[0]}; cl_crosshaircolor_g ${rgb[1]}; cl_crosshaircolor_b ${rgb[2]};`;
}
const ROW=(label,view,edit)=>`<div class="py-3.5 border-b border-[color:var(--line)] last:border-b-0"><div class="text-sm text-mute">${label}</div><div class="view font-serif text-3xl leading-tight break-words">${view}</div><div class="edonly text-xl">${edit}</div></div>`;
const HEAD=t=>`<div class="flex items-center gap-3 mb-3"><span class="w-11 h-11 rounded-full bg-sage/0 grid place-items-center" style="background:color-mix(in srgb,var(--sage) 28%,transparent)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--sage)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[t]||""}</svg></span><h3 class="font-serif text-4xl">${esc(t)}</h3></div>`;
const inp=(a,v,l)=>`<input class="inp" ${a} value="${esc(v)}" aria-label="${esc(l)}">`;

function renderAll(){
  $("xspec").innerHTML=XSPEC.map(([k,l])=>ROW(l,k==="dot"||k==="outline"?(S.xh[k]?"On":"Off"):S.xh[k],inp(`type="number" step="0.5" data-x="${k}"`,S.xh[k],l))).join("");
  $("code").textContent=cmd(); const ci=$("codein"); ci.value=S.code||""; ci.oninput=e=>{ S.code=e.target.value.trim(); $("code").textContent=cmd() };
  $("cc").innerHTML=COLORS.map(c=>`<button class="w-11 h-11 rounded-full border-4 ${S.xh.color===c?"border-terra":"border-cream"} shadow" style="background:${c}" data-c="${c}" aria-label="Crosshair color ${c}"></button>`).join("");
  let sets="",gear="";
  S.groups.forEach((g,gi)=>{
    const rows=g.rows.map((r,ri)=>ROW(esc(r[0]),esc(r[1]),inp(`data-g="${gi}" data-r="${ri}"`,r[1],r[0]))).join("");
    if(g.gear) gear=`<div>${HEAD(g.title)}<p class="text-mute text-lg max-w-xs mt-4">What I play on, from mouse to earphones.</p></div><div class="grid sm:grid-cols-2 gap-x-10">${rows}</div>`;
    else sets+=`<div class="glass2 rounded-[32px] p-7 ${gi%2?"lg:mt-14":""}">${HEAD(g.title)}${rows}</div>`;
  });
  $("sets").innerHTML=sets; $("gearbox").innerHTML=gear;
  const dpi=parseFloat(val("Mouse","DPI"))||0, s=parseFloat(val("Mouse","In-game sensitivity"))||0;
  $("stats").innerHTML=[[Math.round(dpi*s),"eDPI"],[val("Video","Resolution"),"Resolution"],[val("Video","Refresh rate"),"Refresh rate"]].map(([n,l])=>`<div><div class="font-serif text-3xl leading-none">${esc(n)}</div><div class="text-xs opacity-80 mt-1">${l}</div></div>`).join("");
  document.querySelectorAll("[data-x]").forEach(i=>i.oninput=e=>{ const v=parseFloat(e.target.value); if(!isNaN(v)){ S.xh[i.dataset.x]=v; drawXhair(); $("code").textContent=cmd() } });
  document.querySelectorAll("[data-g]").forEach(i=>i.oninput=e=>{ S.groups[+i.dataset.g].rows[+i.dataset.r][1]=e.target.value });
}
function setEdit(on){
  document.body.classList.toggle("editing",on); $("app").classList.toggle("editing",on);
  ["handle"].forEach(id=>{ const el=$(id); el.contentEditable=on; if(!on) S[el.dataset.k]=el.textContent.trim()||DEFAULT[el.dataset.k] });
  if(!on){ $("navname").textContent=S.handle; renderAll() }
}
function persist(){
  try{ localStorage.setItem("cs2setup",JSON.stringify(S)) }catch(e){}
  $("upd").textContent=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
}
$("cc").onclick=e=>{ const c=e.target.closest("[data-c]"); if(c){ S.xh.color=c.dataset.c; drawXhair(); renderAll() } };
$("copy").onclick=async()=>{
  try{ await navigator.clipboard.writeText(cmd()); $("copy").textContent="Copied" }catch(e){ $("copy").textContent="Select and copy above" }
  setTimeout(()=>$("copy").textContent="Copy commands",1800);
};
function init(){
  $("handle").textContent=S.handle; $("navname").textContent=S.handle;
  drawXhair(); renderAll();
}
scene(); init();
</script>
</body>
</html>
